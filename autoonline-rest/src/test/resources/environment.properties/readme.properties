### Test Suite environment.properties ###
#    1. testSuiteClass (mandatory): path from java folder to Test Suite Class, including Class name
test.suite.class=com.solera.global.qa.template.web.test.testsrun.RegressionTestsRun

### Testrail and executions environment.properties ###
#    1. test.execution.mode (mandatory) {debuf|info}
#    2. browser.execution.wait.timeout (mandatory) {1|2|3|...|n}
#    3. testrail.enabled (mandatory) {true|false} Update or not results in TestRail
#    4. testrail.project.name
#    5. testrail.configurations.values List of keys from this file that will be used as configurations in TestRail
testrail.enabled=true
testrail.project.name=TRDM_TEST_1
testrail.suite.name=Frontend
testrail.configurations.values=local.browser.name

#Paralell is not compatible with categories
test.execution.parallel.classes=false | true
test.execution.parallel.methods=false | true
test.execution.mode=info | debug

### Environment environment.properties ###
#    1. environment.url (mandatory) - URL to open on start navigation
environment.url=https://www.saucedemo.com/

# Proxy if it is needed
proxy.host=
proxy.port=

### Local network browser selenium nodes ###
#    1. environment.cloud (mandatory) {false}
#    2. local.browser.name (mandatory if environment.cloud=false) {chrome|firefox|internet explorer}
#    5. local.host.url (mandatory if environment.cloud=false) {http://IP:port/wd/hub}
environment.cloud=false
local.browser.name=chrome
local.host.url=http://localhost:4444/wd/hub

