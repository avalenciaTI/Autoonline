
test.suite.class=com.solera.global.qa.autoonline.web.test.testsrun.DebugTestsRun

### JFramework ###
testrail.enabled=false
testrail.project.name=AutoOnline MX
testrail.suite.name=Frontend
testrail.configurations.values=local.browser.name

#execution
test.execution.parallel.classes=false
test.execution.parallel.methods=false
test.execution.mode=debug
test.execution.results.extended=true

### Environment URLs ###
//environment.url=https://autoonlinemx.tkg-rms-qae.usdc01.solera.farm/
environment.url=https://autoonline-cae.audatex.com.mx/

### Local network browser selenium nodes ###
environment.cloud=false
#If you comment  "local.host.url", tests will be run in local browsers
local.host.url=http://localhost:4444/wd/hub
local.browser.name=MicrosoftEdge
local.browser.version=Version 119.0.6045.199
browser.execution.wait.timeout=10
environment.interface=WorkPage
local.browser.platform=WINDOWS

#to enable/disable S3 integration, mandatory (true/false)
aws.s3.enabled=false
#to specify location in S3 bucket to download files from, mandatory (Example = QapterClaims/GSA)
aws.s3.download.from.dirpath=autoonline-mx/files
#to specify location where to download files on local machine, optional, default: target/files/s3
aws.s3.download.to.folder=target/files/s3
#to specify location from where to upload report/files on local machine, optional, default: target/reports
aws.s3.upload.from.folder=target/reports
#to specify location in S3 bucket to upload report/files to, mandatory (Example = ExtentReports/QapterClaims/GSA)
aws.s3.upload.to.dirpath=autoonline-mx/reports
#to customize location in S3 bucket where report/files would be uploaded, mandatory (Example = DE - WPV (B2B and Audafusion))
aws.s3.upload.suite.name=autoonline-mx/ES - autoonline-mx

#It is no longer mandatory for "scale.factor.disabled,force.scale.factor and browser.chrome.language" with taf version 1.0.8
#scale.factor.disabled=false
#force.scale.factor=1
#browser.chrome.language=en